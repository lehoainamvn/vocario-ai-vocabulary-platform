# =========================================================================
# Profile Prod: Dành riêng cho Cloud Deployment (Render + Supabase IPv4 Pooler)
# =========================================================================
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vocario_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: "${SPRING_DATASOURCE_PASSWORD:}"
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

logging:
  level:
    root: INFO
    com.vocario: INFO
