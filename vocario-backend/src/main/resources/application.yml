server:
  port: 8088

spring:
  application:
    name: vocario-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    serialization:
      fail-on-empty-beans: false

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

# Cấu hình Swagger UI (SpringDoc OpenAPI)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# Cấu hình đường dẫn AI Vision Service
vocario:
  ai:
    python-path: ${PYTHON_PATH:py}
    yolo-script-path: ${YOLO_SCRIPT_PATH:../test_detect.py}
    upload-dir: ${UPLOAD_DIR:uploads}

# Cấu hình Ghi Log (Console + File logs/vocario.log)
logging:
  file:
    name: logs/vocario.log
  level:
    root: INFO
    com.vocario: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

