<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140" fill="none">
  <defs>
    <linearGradient id="hWoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C755E"/>
      <stop offset="50%" stop-color="#7D6853"/>
      <stop offset="100%" stop-color="#685542"/>
    </linearGradient>
    <radialGradient id="hAmberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCE38A"/>
      <stop offset="60%" stop-color="#F7D147"/>
      <stop offset="100%" stop-color="#E8BA20"/>
    </radialGradient>
    <filter id="hShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#2D2823" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem Container (100x100) -->
  <g transform="translate(16, 20)">
    <rect width="100" height="100" rx="26" fill="#F8F6F1" filter="url(#hShadow)"/>
    <rect width="100" height="100" rx="26" stroke="#E5DED3" stroke-width="1.5"/>

    <!-- Optical Brackets -->
    <path d="M22 34 V 22 H 34" stroke="#7D6853" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78 66 V 78 H 66" stroke="#7D6853" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M66 22 H 78 V 34" stroke="#7D6853" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    <path d="M34 78 H 22 V 66" stroke="#7D6853" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

    <!-- "V" Monogram -->
    <path d="M32 35 L 50 76 C 50.8 77.8 52.2 77.8 53 76 L 71 35" 
          stroke="url(#hWoodGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Open Book Leaf -->
    <path d="M41 42 L 51.5 66 L 62 42" 
          stroke="#5C4D3E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

    <!-- Amber Focus Iris -->
    <circle cx="51.5" cy="77" r="4.5" fill="url(#hAmberGlow)"/>
    <circle cx="51.5" cy="77" r="7" stroke="#F7D147" stroke-width="1" stroke-opacity="0.45"/>
  </g>

  <!-- Right Typography (Wordmark & Tagline) -->
  <g transform="translate(138, 32)">
    <!-- Brand Name (Newsreader / Garamond Serif Style) -->
    <text x="0" y="52" 
          font-family="'Newsreader', 'Georgia', 'Garamond', 'Times New Roman', serif" 
          font-size="52" 
          font-weight="600" 
          fill="#2D2823" 
          letter-spacing="0.8">
      Vocario
    </text>

    <!-- Amber Period Dot (Completion & Precision) -->
    <circle cx="204" cy="48" r="5" fill="url(#hAmberGlow)"/>

    <!-- Tagline (Outfit / Inter Sans-serif Style) -->
    <text x="2" y="78" 
          font-family="'Outfit', 'Inter', -apple-system, sans-serif" 
          font-size="12.5" 
          font-weight="700" 
          fill="#7D6853" 
          letter-spacing="3.2">
      SMART VISION ENGLISH
    </text>

    <!-- Thin Divider Accent -->
    <rect x="2" y="62" width="220" height="1" fill="#E5DED3"/>
  </g>
</svg>

