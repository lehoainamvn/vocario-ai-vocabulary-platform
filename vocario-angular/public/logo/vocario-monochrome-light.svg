<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Monochrome Light (Single Color #FFFFFF for Dark Theme, Video Watermarks, Signage) -->
  <!-- Optical Camera Viewfinder L-Brackets -->
  <path d="M100 160 V 100 H 160" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M352 100 H 412 V 160" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 352 V 412 H 160" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M412 352 V 412 H 352" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main "V" Monogram -->
  <path d="M152 168 L 244 380 C 248 388 254 392 256 392 C 258 392 264 388 268 380 L 360 168" 
        stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner Book Fold -->
