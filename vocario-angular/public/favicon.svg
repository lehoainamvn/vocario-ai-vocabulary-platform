<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Nền Canvas Washi ấm áp -->
  <rect width="64" height="64" rx="16" fill="#F8F6F1"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#E5DED3" stroke-width="1.2"/>

  <!-- Khung ngắm L-Brackets quang học AI (Góc trên-trái và Dưới-phải) -->
  <path d="M12 20V12H20" stroke="#7D6853" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 44V52H44" stroke="#7D6853" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44 12H52V20" stroke="#7D6853" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M20 52H12V44" stroke="#7D6853" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- Cánh chữ V: Nét thanh thư pháp phong cách Editorial -->
  <path d="M19 19L31 46C31.4 46.8 32.6 46.8 33 46L45 19" stroke="#7D6853" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lõi sách mở & Hội tụ tri thức bên trong chữ V -->
  <path d="M25 24L32 39L39 24" stroke="#5C4D3E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Điểm nhấn hổ phách Baltic (Tia hội tụ thị giác AI) -->
  <circle cx="32" cy="46" r="3" fill="#F7D147"/>
  <circle cx="32" cy="46" r="5" stroke="#F7D147" stroke-width="1" stroke-opacity="0.5"/>
</svg>
