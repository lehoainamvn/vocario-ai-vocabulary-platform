<div class="min-h-screen bg-[#F8F6F1] text-[#2D2823] flex flex-col" [class.items-center]="!isAdminRoute()">
  
  <!-- =========================================================================
       1. THANH ĐIỀU HƯỚNG NAVBAR CHUNG (CHỈ HIỂN THỊ KHI Ở GIAO DIỆN HỌC VIÊN/GUEST)
       ========================================================================= -->
  <app-navbar
    *ngIf="!isAdminRoute()"
    [activeTab]="currentTab"
    actionLabel="Tải App"
    (tabChange)="handleTabChange($event)"
    (openAuth)="openAuth($event)"
  ></app-navbar>

  <!-- =========================================================================
       2. KHUNG NỘI DUNG CHÍNH (NƠI ROUTER TỰ ĐỘNG NẠP CÁC TRANG VÀO ĐÂY)
       ========================================================================= -->
  <main class="w-full flex-1 flex flex-col animate-fade-in" [class.items-center]="!isAdminRoute()" [class.pb-8]="!isAdminRoute()">
    <router-outlet></router-outlet>
  </main>

  <!-- =========================================================================
       3. CHÂN TRANG ĐỒNG BỘ CHO TOÀN BỘ CÁC TRANG CỦA HỌC VIÊN
       ========================================================================= -->
  <footer *ngIf="api.currentUser() && !isAdminRoute()" class="w-full mt-auto border-t border-[#E5DED3] bg-[#FAF8F5] py-4 px-6 text-center text-xs text-[#5C5249]">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="font-serif font-bold text-sm text-[#7D6853]">Vocario</span>
        <span>•</span>
        <span>Học ngoại ngữ qua ngữ cảnh đời thực & chu kỳ giãn cách SM-2</span>
      </div>
      <div class="flex items-center gap-4 text-[11px] text-[#7D6853]">
        <a routerLink="/home" class="hover:underline no-underline text-[#7D6853]">Trang Chủ</a>
        <a routerLink="/scanner" class="hover:underline no-underline text-[#7D6853]">Quét Ảnh</a>
        <a routerLink="/collection" class="hover:underline no-underline text-[#7D6853]">Bộ Sưu Tập</a>
        <a routerLink="/profile" class="hover:underline no-underline text-[#7D6853]">Hồ Sơ</a>
        <span>© 2026 Vocario</span>
      </div>
    </div>
  </footer>

  <!-- =========================================================================
       4. NÚT CUỘN LÊN ĐẦU TRANG NỔI (CHỈ CHO GIAO DIỆN HỌC VIÊN)
       ========================================================================= -->
  <button
    *ngIf="!isAdminRoute() && showScrollTop()"
    (click)="windowScrollTop()"
    class="fixed bottom-6 right-6 w-11 h-11 rounded-full bg-[#FAF8F5] hover:bg-white border border-[#E5DED3] text-[#7D6853] shadow-md hover:shadow-lg flex items-center justify-center cursor-pointer transition-all active:scale-95 z-40 animate-fade-in"
    title="Lên đầu trang"
  >
    <svg class="w-4 h-4 text-[#7D6853]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 15-6-6-6 6"/>
    </svg>
  </button>

  <!-- =========================================================================
       5. MODAL ĐĂNG NHẬP / ĐĂNG KÝ
       ========================================================================= -->
  <app-auth-modal
    *ngIf="api.authModalState().open"
    [initialTab]="api.authModalState().tab"
    (closeModal)="closeAuth()"
    (authSuccess)="handleAuthSuccess($event)"
  ></app-auth-modal>

  <!-- =========================================================================
       6. HỆ THỐNG THÔNG BÁO TOAST TOÀN CỤC
       ========================================================================= -->
  <app-toast-container></app-toast-container>

  <!-- =========================================================================
       7. MODAL CHẤM ĐIỂM PHÁT ÂM AI TOÀN CỤC (SPEECH SCORER)
       ========================================================================= -->
  <app-speech-scorer-modal></app-speech-scorer-modal>

</div>
